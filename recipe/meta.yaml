{% set name = "apprise" %}
{% set version = "1.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/apprise-{{ version }}.tar.gz
  sha256: 67e0c227eecee260000980dbbf8ba1e5eebdbe494f4730808297c9e645c03579

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - babel
    - pip
    - python >=3.6
    - setuptools
  run:
    - click >=5.0
    - markdown
    - python >=3.6
    - pyyaml
    - requests
    - requests-oauthlib
    - six

test:
  imports:
    - apprise
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/caronc/apprise
  summary: Push Notifications that work with just about every platform
  description: Push Notifications that work with just about every platform
  license: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/caronc/apprise
  doc_url: https://github.com/caronc/apprise/blob/master/README.md

extra:
  skip-lints:
    - host_section_needs_exact_pinnings
    - avoid_noarch
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/95281
    reason: Dependency for prefect
  recipe-maintainers:
    - ianaobi
    - bkreider
  recipe-maintainers:
    - thewchan
